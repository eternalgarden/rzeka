name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # necessary for nuget trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed by MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            --no-restore \
            --configuration Release

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --configuration Release

      # 📜 packaging
      - name: Pack core
        run: |
          dotnet pack core/Rzeka.Core.csproj \
            --no-build \
            --configuration Release \
            --output ./artifacts

      - name: Pack dev
        run: |
          dotnet pack dev/Rzeka.Dev.csproj \
            --no-build \
            --configuration Release \
            --output ./artifacts

      - name: Pack reporting
        run: |
          dotnet pack reporting/Rzeka.Reporting.csproj \
            --no-build \
            --configuration Release \
            --output ./artifacts
      
      # 📜 nuget login through 'trusted publishing'
      # requires a user with admin privileges for eternal-garden organisation at nuget.org
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # 📜 pushing all packages to nuget
      - name: Push to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # 📜 github release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
